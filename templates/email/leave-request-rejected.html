<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>เอกสารของคุณถูกปฏิเสธ | empeo</title>
  <!--
    empeo — Leave request rejected notification

    Asset URLs are left as {{placeholders}} so they can be pointed at the
    mail CDN at send time. Everything else is the sample content from the
    approved design.

    Brand tokens used (empeo / Gofive Design System):
      Flame (primary)  #E2673C
      Charcoal (L1)    #1F2937
      Iron (L2)        #374151
      Lead (L3)        #4B5563
      Porpoise (L5)    #9CA3AF   <- rejected badge
      Card border      #E5E7EB
      Footer BG        #F5F6F7
  -->
  <style type="text/css">
    /* Clients that support <style> get the nicer stack; the rest fall back
       to the inline font-family declarations below. */
    body, table, td, p, h1, h2 {
      font-family: 'GoFive Font', 'Prompt', 'Noto Sans Thai', 'Kanit', Arial, sans-serif;
    }
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .gutter    { padding-left: 20px !important; padding-right: 20px !important; }
      .row-label { display: block !important; width: 100% !important; padding-bottom: 2px !important; }
      .row-value { display: block !important; width: 100% !important; }
      .doc-title { font-size: 18px !important; }
    }
  </style>
</head>

<body style="margin:0; padding:0; background-color:#ffffff; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

  <!-- Preheader (hidden) -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
    ลาป่วย (L230200033) — เอกสารของคุณถูกปฏิเสธ
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:0;">

        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

          <!-- Logo -->
          <tr>
            <td align="center" class="gutter" style="padding:48px 40px 40px 40px;">
              <img src="{{logoUrl}}" width="180" height="42" alt="empeo"
                   style="display:block; border:0; outline:none; text-decoration:none; height:auto; max-width:180px;" />
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td align="center" class="gutter" style="padding:0 40px 12px 40px;">
              <h1 style="margin:0; font-size:24px; line-height:1.4; font-weight:700; color:#1F2937;
                         font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                สวัสดี สมปอง หมายปอง
              </h1>
            </td>
          </tr>

          <!-- Subtitle -->
          <tr>
            <td align="center" class="gutter" style="padding:0 40px 40px 40px;">
              <p style="margin:0; font-size:18px; line-height:1.5; font-weight:400; color:#374151;
                        font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                เอกสารของคุณถูกปฏิเสธ
              </p>
            </td>
          </tr>

          <!-- Document card -->
          <tr>
            <td class="gutter" style="padding:0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                     style="border:1px solid #E5E7EB; border-radius:12px; background-color:#ffffff;">
                <tr>
                  <td style="padding:24px;">

                    <!-- Title + status badge -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="left" valign="middle" style="padding:0 12px 0 0;">
                          <!-- Document title: 18px -->
                          <span class="doc-title"
                                style="font-size:18px; line-height:1.5; font-weight:700; color:#1F2937;
                                       font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                            ลาป่วย (L230200033)
                          </span>
                        </td>
                        <td align="right" valign="middle" width="88" style="width:88px;">
                          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right">
                            <tr>
                              <td align="center"
                                  style="background-color:#9CA3AF; border-radius:16px; padding:6px 18px;
                                         font-size:14px; line-height:1.4; font-weight:400; color:#ffffff;
                                         white-space:nowrap;
                                         font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                                ปฏิเสธ
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>

                    <!-- Detail rows -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:16px;">
                      <tr>
                        <td class="row-label" align="left" valign="top" width="112"
                            style="width:112px; padding:0 12px 10px 0; font-size:16px; line-height:1.6;
                                   font-weight:400; color:#4B5563;
                                   font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                          วันที่:
                        </td>
                        <td class="row-value" align="left" valign="top"
                            style="padding:0 0 10px 0; font-size:16px; line-height:1.6;
                                   font-weight:400; color:#1F2937;
                                   font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                          25 กรกฎาคม 2565 (1 วัน)
                        </td>
                      </tr>
                      <tr>
                        <td class="row-label" align="left" valign="top" width="112"
                            style="width:112px; padding:0 12px 0 0; font-size:16px; line-height:1.6;
                                   font-weight:400; color:#4B5563;
                                   font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                          รายละเอียด:
                        </td>
                        <!-- Detail value: 16px -->
                        <td class="row-value" align="left" valign="top"
                            style="padding:0; font-size:16px; line-height:1.6;
                                   font-weight:700; color:#1F2937;
                                   font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                          เป็นไข้ใจ
                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="center" class="gutter" style="padding:40px 40px 56px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#E2673C" style="border-radius:8px;">
                    <a href="{{documentUrl}}" target="_blank"
                       style="display:inline-block; padding:16px 44px; border-radius:8px;
                              background-color:#E2673C; color:#ffffff; font-size:18px; line-height:1.4;
                              font-weight:700; text-decoration:none;
                              font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                      ดูเอกสาร
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td align="center" style="background-color:#F5F6F7; padding:0;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">
          <tr>
            <td class="gutter" style="padding:28px 40px 32px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="left" valign="top">
                    <img src="{{poweredByLogoUrl}}" width="124" height="26" alt="Powered by empeo"
                         style="display:block; border:0; outline:none; text-decoration:none; height:auto; max-width:124px;" />
                  </td>
                  <td align="right" valign="top">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right">
                      <tr>
                        <td style="padding:0 0 0 14px;">
                          <a href="{{facebookUrl}}" target="_blank" style="text-decoration:none;">
                            <img src="{{facebookIconUrl}}" width="22" height="22" alt="Facebook"
                                 style="display:block; border:0; outline:none; text-decoration:none;" />
                          </a>
                        </td>
                        <td style="padding:0 0 0 14px;">
                          <a href="{{youtubeUrl}}" target="_blank" style="text-decoration:none;">
                            <img src="{{youtubeIconUrl}}" width="26" height="22" alt="YouTube"
                                 style="display:block; border:0; outline:none; text-decoration:none;" />
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td colspan="2" align="left" style="padding:14px 0 0 0;">
                    <p style="margin:0; font-size:15px; line-height:1.6; font-weight:400; color:#374151;
                              font-family:'GoFive Font','Prompt','Noto Sans Thai','Kanit',Arial,sans-serif;">
                      92 Central Park Offices,<br />
                      Unit MM3205, 32nd Floor, Rama 4 Road,<br />
                      Silom, Bang Rak, Bangkok 10500
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
